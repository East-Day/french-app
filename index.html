      { inf: "préférer", forms: { je: "préfère", tu: "préfères", il: "préfère", elle: "préfère", nous: "préférons", vous: "préférez", ils: "préfèrent", elles: "préfèrent" } },
      { inf: "espérer", forms: { je: "espère", tu: "espères", il: "espère", elle: "espère", nous: "espérons", vous: "espérez", ils: "espèrent", elles: "espèrent" } },
      { inf: "commencer", forms: { je: "commence", tu: "commences", il: "commence", elle: "commence", nous: "commençons", vous: "commencez", ils: "commencent", elles: "commencent" } },
      { inf: "manger", forms: { je: "mange", tu: "manges", il: "mange", elle: "mange", nous: "mangeons", vous: "mangez", ils: "mangent", elles: "mangent" } },
      { inf: "choisir", forms: { je: "choisis", tu: "choisis", il: "choisit", elle: "choisit", nous: "choisissons", vous: "choisissez", ils: "choisissent", elles: "choisissent" } },
      { inf: "finir", forms: { je: "finis", tu: "finis", il: "finit", elle: "finit", nous: "finissons", vous: "finissez", ils: "finissent", elles: "finissent" } },
      { inf: "réussir", forms: { je: "réussis", tu: "réussis", il: "réussit", elle: "réussit", nous: "réussissons", vous: "réussissez", ils: "réussissent", elles: "réussissent" } },
      { inf: "réfléchir", forms: { je: "réfléchis", tu: "réfléchis", il: "réfléchit", elle: "réfléchit", nous: "réfléchissons", vous: "réfléchissez", ils: "réfléchissent", elles: "réfléchissent" } },
      { inf: "traduire", forms: { je: "traduis", tu: "traduis", il: "traduit", elle: "traduit", nous: "traduisons", vous: "traduisez", ils: "traduisent", elles: "traduisent" } },
      { inf: "produire", forms: { je: "produis", tu: "produis", il: "produit", elle: "produit", nous: "produisons", vous: "produisez", ils: "produisent", elles: "produisent" } },
      { inf: "conduire", forms: { je: "conduis", tu: "conduis", il: "conduit", elle: "conduit", nous: "conduisons", vous: "conduisez", ils: "conduisent", elles: "conduisent" } },
      { inf: "convaincre", forms: { je: "convaincs", tu: "convaincs", il: "convainc", elle: "convainc", nous: "convainquons", vous: "convainquez", ils: "convainquent", elles: "convainquent" } },
      { inf: "résoudre", forms: { je: "résous", tu: "résous", il: "résout", elle: "résout", nous: "résolvons", vous: "résolvez", ils: "résolvent", elles: "résolvent" } },
      { inf: "offrir", forms: { je: "offre", tu: "offres", il: "offre", elle: "offre", nous: "offrons", vous: "offrez", ils: "offrent", elles: "offrent" } },
      { inf: "découvrir", forms: { je: "découvre", tu: "découvres", il: "découvre", elle: "découvre", nous: "découvrons", vous: "découvrez", ils: "découvrent", elles: "découvrent" } },
      { inf: "craindre", forms: { je: "crains", tu: "crains", il: "craint", elle: "craint", nous: "craignons", vous: "craignez", ils: "craignent", elles: "craignent" } },
      { inf: "dormir", forms: { je: "dors", tu: "dors", il: "dort", elle: "dort", nous: "dormons", vous: "dormez", ils: "dorment", elles: "dorment" } },
      { inf: "sentir", forms: { je: "sens", tu: "sens", il: "sent", elle: "sent", nous: "sentons", vous: "sentez", ils: "sentent", elles: "sentent" } }
    ];

    const PRONOUNS = ["je", "tu", "il", "elle", "nous", "vous", "ils", "elles"];

    const overlay = document.getElementById("overlay");
    const mark = document.getElementById("overlay-mark");
    const remember = document.getElementById("remember");
    const scoreline = document.getElementById("scoreline");

    const sessions = {};
    let stats = { ok: 0, bad: 0 };
    let overlayTimer = null;
    let waitingMode = null;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function norm(s) {
      return s.normalize("NFC").trim().toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, " ");
    }

    function stripExtras(s, pronoun) {
      let t = norm(s);
      t = t.replace(/^(le|la|les|un|une|des|l')\s+/i, "");
      t = t.replace(/^l'/, "");
      if (pronoun) {
        const p = norm(pronoun);
        if (t.startsWith(p + " ")) t = t.slice(p.length + 1);
      }
      return t;
    }

    function buildQueue(m) {
      if (m === "fem") return shuffle(FEM).map(([q, a]) => ({ q, a, kind: "text" }));
      if (m === "plural") return shuffle(PLURAL).map(([q, a]) => ({ q, a, kind: "text" }));
      if (m === "gender") return shuffle(GENDER).map(([q, a]) => ({ q, a, kind: "gender" }));
      const items = [];
      for (const v of VERBS) {
        for (const p of PRONOUNS) items.push({ q: v.inf, pronoun: p, a: v.forms[p], kind: "verb" });
      }
      return shuffle(items);
    }

    function wordBox(text, sub) {
      return `
        <div class="rounded-2xl border border-line bg-ink/50 px-5 py-6 text-center">
          <p class="font-serif text-3xl text-cream md:text-4xl">${text}</p>
          ${sub ? `<p class="mt-2 text-[10px] uppercase tracking-[0.2em] text-mute">${sub}</p>` : ""}
        </div>`;
    }

    function currentOf(mode) {
      const s = sessions[mode];
      return s.queue[s.index];
    }

    function render(mode) {
      const s = sessions[mode];
      const item = currentOf(mode);
      s.root.querySelector(".count").textContent = `${s.index + 1} / ${s.queue.length}`;
      const box = s.root.querySelector(".prompt");
      if (item.kind === "verb") {
        box.innerHTML = `<div class="grid grid-cols-2 gap-3">${wordBox(item.q, "verbe")}${wordBox(item.pronoun, "personne")}</div>`;
      } else if (item.kind === "gender") {
        box.innerHTML = wordBox(item.q, "nom");
      } else {
        box.innerHTML = wordBox(item.q, mode === "fem" ? "masculin" : "singulier");
      }
      const input = s.root.querySelector("input");
      if (input) input.value = "";
      scoreline.textContent = `对 ${stats.ok}  ·  错 ${stats.bad}`;
    }

    function burst() {
      if (typeof confetti !== "function") return;
      confetti({
        particleCount: 70,
        spread: 62,
        origin: { y: 0.62 },
        colors: ["#d7b07a", "#f4efe6", "#c45c4a", "#8aa0c8"],
      });
    }

    function next(mode) {
      const s = sessions[mode];
      s.index += 1;
      if (s.index >= s.queue.length) {
        s.queue = buildQueue(mode);
        s.index = 0;
      }
      render(mode);
    }

    function showFaux(answer, mode) {
      waitingMode = mode;
      overlay.classList.remove("hidden");
      remember.classList.add("hidden");
      mark.textContent = "Faux";
      mark.className = "animate__animated animate__shakeX font-serif text-7xl font-medium tracking-[0.18em] text-red-500 md:text-8xl";
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        mark.textContent = answer;
        mark.className = "animate__animated animate__fadeIn font-serif text-5xl font-medium tracking-normal text-red-400 md:text-6xl";
        remember.classList.remove("hidden");
        remember.classList.add("animate__animated", "animate__fadeInUp");
      }, 2000);
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
      remember.classList.add("hidden");
      remember.classList.remove("animate__animated", "animate__fadeInUp");
    }

    function judge(mode, ok, shown) {
      if (ok) {
        stats.ok += 1;
        burst();
        next(mode);
      } else {
        stats.bad += 1;
        showFaux(shown, mode);
      }
      scoreline.textContent = `对 ${stats.ok}  ·  错 ${stats.bad}`;
    }

    document.querySelectorAll("article[data-mode]").forEach((root) => {
      const mode = root.dataset.mode;
      sessions[mode] = { root, queue: buildQueue(mode), index: 0 };
      render(mode);

      const form = root.querySelector(".answer-form");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const item = currentOf(mode);
          const given = stripExtras(form.querySelector("input").value, item.pronoun);
          const shown = item.kind === "verb" ? `${item.pronoun} ${item.a}` : item.a;
          judge(mode, given === norm(item.a) && given.length > 0, shown);
        });
      }

      root.querySelectorAll("[data-g]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = currentOf(mode);
          const label = item.a === "m" ? "阳 · masculin" : "阴 · féminin";
          judge(mode, btn.dataset.g === item.a, `${item.q} → ${label}`);
        });
      });
    });

    remember.addEventListener("click", () => {
      const mode = waitingMode;
      hideOverlay();
      if (mode) next(mode);
      waitingMode = null;
    });
  </script>
</body>
</html>
